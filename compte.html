<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon compte Noopie</title>
<meta name="description" content="Votre espace Noopie : animaux, position, alertes, médaillons, zones et partage.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="refs/vendor/maplibre/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1F6FEB;--blue-2:#1A5FD6;--ink:#26211C;--ink-2:#5B544C;--muted:#7A8291;--line:#E6ECF5;--soft:#F4F7FD;--bg:#F7F9FD;--card:#fff;--ok:#1C9A63;--okbg:#E6F6EE;--red:#E5484D;--redbg:#FDECEC;--gold:#E4A522;--goldbg:#FFF4D6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.logo svg{height:40px;width:auto;display:block}
h1,h2,h3,.f{font-family:"DM Sans",system-ui,sans-serif}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;font-family:"DM Sans",sans-serif;font-weight:600;font-size:16px;text-decoration:none;transition:background .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(31,111,235,.28)} .btn-blue:hover{background:var(--blue-2)}
.btn-white{background:#fff;color:var(--blue);border:1.5px solid rgba(31,111,235,.3)} .btn-white:hover{background:var(--soft)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-ok{color:var(--ok);background:var(--okbg)} .chip-red{color:var(--red);background:var(--redbg)} .chip-gold{color:#9A6800;background:var(--goldbg)} .chip-blue{color:var(--blue);background:#EAF1FE}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 #EEF2F8 inset,0 8px 24px rgba(31,111,235,.06);padding:20px;min-width:0}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.ttl h3{margin:0;font-size:19px;font-weight:700;color:var(--blue-2)}
.ttl a,.link{font-weight:800;font-size:14px;color:var(--blue);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.muted{color:var(--muted);font-weight:600}
.demo{font-size:12.5px;font-weight:700;color:#7A5200;background:var(--goldbg);border-radius:12px;padding:8px 12px}

/* ---------- AUTH ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{position:relative;overflow:hidden;background:linear-gradient(160deg,#EAF2FF 0%,#F7FAFF 60%,#fff 100%);padding:40px clamp(24px,5vw,64px);display:flex;flex-direction:column}
.auth-side h2{font-size:clamp(30px,3.4vw,46px);line-height:1.05;color:var(--blue-2);margin:auto 0 12px;font-weight:700}
.auth-side p{margin:0;font-weight:800;max-width:440px}
.auth-pets{display:flex;align-items:flex-end;gap:0;margin-top:28px}
.auth-pets img{width:46%;max-width:260px;height:auto}
.auth-feats{margin:22px 0 auto;padding:0;list-style:none;display:grid;gap:10px}
.auth-feats li{display:flex;gap:10px;align-items:center;font-weight:800}
.auth-feats li span{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--blue);box-shadow:0 4px 10px rgba(31,111,235,.12);font-size:14px}
.auth-main{display:flex;flex-direction:column;padding:32px clamp(20px,5vw,72px)}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.auth-box{width:100%;max-width:400px;margin:auto}
.auth-box h1{font-size:34px;margin:0 0 6px;color:var(--blue-2);font-weight:700}
.auth-box > p{margin:0 0 22px;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px;margin-bottom:20px}
.tabs button{appearance:none;border:0;background:none;border-radius:99px;min-height:40px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--blue-2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:800}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #DCE8FD}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:grid;gap:10px}
.sso .btn{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-family:"DM Sans",sans-serif;font-weight:800;font-size:15px}
.sso .btn:hover{background:var(--soft)}
.full{width:100%}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-2px 0 14px;font-size:13.5px;font-weight:700}
.row-between label{display:flex;gap:8px;align-items:center}
.row-between input{accent-color:var(--blue);width:16px;height:16px}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:800;color:#3E4757}
.nav a svg{width:20px;height:20px;flex:none;color:#8A93A3}
.nav a:hover{background:var(--soft)}
.nav a.on{background:#EAF1FE;color:var(--blue-2)} .nav a.on svg{color:var(--blue)}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;display:grid;gap:10px}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--soft)}
.side-user .ini{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:"DM Sans",sans-serif;font-weight:700}
.side-user b{display:block;font-size:14px} .side-user span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:700;color:var(--blue-2)}
.topbar p{margin:2px 0 0;font-weight:800}
.mobile-bar{display:none}
.grid{display:grid;gap:16px}
.g-dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi small{display:block;font-size:12.5px;font-weight:800;color:var(--muted)}
.kpi b{display:block;font-family:"DM Sans",sans-serif;font-size:28px;color:var(--blue-2);line-height:1.15}
.kpi span{font-size:12.5px;font-weight:700;color:var(--ok)}

.map{position:relative;border-radius:16px;overflow:hidden;background:#dbe9fa url("refs/alert-map.webp") 55% 35% / cover no-repeat;min-height:280px}
.map-lg{min-height:520px}
.pin{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--blue);padding:3px;box-shadow:0 0 0 0 rgba(31,111,235,.4);animation:pulse 2s infinite;cursor:pointer;border:0}
.pin img{width:100%;height:100%;border-radius:50%;display:block}
.pin.cat{background:#C9A27E;animation-delay:-1s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,111,235,.45)}100%{box-shadow:0 0 0 18px rgba(31,111,235,0)}}
.zone-ring{position:absolute;border:2px dashed var(--blue);background:rgba(31,111,235,.10);border-radius:50%;pointer-events:none}
.zone-ring span{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}
.map-card{position:absolute;left:14px;bottom:14px;right:14px;max-width:420px;background:rgba(255,255,255,.96);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.map-card b{display:block;font-size:15px}
.map-ctrl{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.map-ctrl button{border:0;background:#fff;border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.map-ctrl button.on{background:var(--blue);color:#fff}

.pet{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft)}
.pet + .pet{margin-top:10px}
.pet b{display:block;font-size:15.5px}
.pet .meta{font-size:12.5px;color:var(--muted);font-weight:700}
.pet .r{margin-left:auto;text-align:right;display:grid;gap:4px;justify-items:end}
.batt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#3E4757}
.batt i{width:22px;height:11px;border-radius:3px;border:1.5px solid #3E4757;position:relative;display:inline-block}
.batt i::after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:var(--b,70%);background:var(--ok);border-radius:1px}

.feed{display:grid;gap:10px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--soft)}
.ev .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.ic-red{background:var(--red)} .ic-blue{background:var(--blue)} .ic-green{background:#22B573} .ic-gold{background:var(--gold)}
.ev b{display:block;font-size:14.5px} .ev span{display:block;font-size:13px;font-weight:600;color:#4B5563} .ev em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700;margin-left:auto;white-space:nowrap}
.ev.unread{background:#fff;box-shadow:inset 3px 0 0 var(--blue),0 4px 14px rgba(31,111,235,.08)}

.petcard{padding:0;overflow:hidden}
.petcard .hd{display:flex;gap:14px;align-items:center;padding:18px;background:linear-gradient(135deg,#EAF2FF,#F7FAFF)}
.petcard .hd img{width:72px;height:72px;border-radius:50%;border:4px solid #fff}
.petcard .hd h3{margin:0;font-size:22px;color:var(--blue-2)}
.petcard dl{margin:0;padding:14px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.petcard dl div{background:var(--soft);border-radius:12px;padding:8px 10px;min-width:0}
.petcard dt{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.petcard dd{margin:0;font-weight:800;font-size:14px}
.petcard .ft{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px}
.add-card{display:grid;place-items:center;text-align:center;border:2px dashed #BBD0F5;background:transparent;box-shadow:none;min-height:240px;cursor:pointer;color:var(--blue)}
.add-card b{font-family:"DM Sans",sans-serif;font-size:19px}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle b{display:block;font-size:15px} .toggle span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.sw{appearance:none;position:relative;width:48px;height:28px;border-radius:99px;background:#D1D5DB;cursor:pointer;flex:none;transition:background .2s;border:0;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw:checked{background:#34C759} .sw:checked::after{left:23px}
.sw.red:checked{background:var(--red)}

.medal-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--soft)}
.medal-row + .medal-row{margin-top:10px}
.medal-row img{width:54px;height:64px;object-fit:contain}
.medal-row b{display:block}
.medal-row .r{margin-left:auto;display:grid;gap:6px;justify-items:end}
.qrbox{display:flex;gap:16px;align-items:center}
.qrbox img{width:120px;height:120px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.08)}

.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .ini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"DM Sans",sans-serif;font-weight:700;flex:none}
.person b{display:block} .person span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.person .r{margin-left:auto}

.order{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--soft)}
.order + .order{margin-top:10px}
.order img{width:56px;height:56px;object-fit:contain}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{height:6px;flex:1;border-radius:9px;background:#DCE3EE}
.steps i.on{background:var(--blue)}

.lostbanner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--redbg);border-radius:16px;padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.lostbanner b{color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1C1C1E;color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow:auto}
.modal h3{margin:0 0 4px;font-size:22px;color:var(--blue-2)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.range{width:100%;accent-color:var(--blue)}


.nearlayer{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
.nearlayer.off{opacity:0}
.near{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.near i{width:16px;height:16px;border-radius:50%;background:#7FA6E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(127,166,232,.25)}
.near b{font-size:10.5px;background:rgba(255,255,255,.92);border-radius:99px;padding:1px 7px;white-space:nowrap}
.map-ctrl button.on-near{background:#EAF1FE;color:var(--blue)} .map-ctrl button.on-near.off{background:#fff;color:var(--ink)}
.kv{margin:0;display:grid;gap:8px} .kv div{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:8px 12px} .kv dt{font-weight:800;color:var(--muted);font-size:13px} .kv dd{margin:0;font-weight:800;text-align:right}
.spark{height:90px;display:flex;align-items:flex-end;gap:6px}
.spark i{flex:1;border-radius:6px 6px 0 0;background:#DCE8FD}
.spark i:last-child{background:var(--blue)}
.bars{height:220px;display:flex;align-items:flex-end;gap:10px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#5B9BFF,#1F6FEB)}
.bars b{font-size:11px;color:var(--muted)} .bars em{font-style:normal;font-size:11px;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg{text-align:center;padding:12px 6px;border-radius:14px;background:var(--soft);opacity:.45;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;background:#FFF7E0}
.bdg span{font-size:26px;display:block} .bdg b{display:block;font-size:13.5px} .bdg small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.lostcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--soft);flex-wrap:wrap}
.lostcard + .lostcard{margin-top:10px}
.lostcard img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.lostcard > div{flex:1;min-width:160px} .lostcard b{display:block} .lostcard .muted{display:block;font-size:13px}
.acts2{display:flex;gap:8px;flex:0 0 auto!important;min-width:0!important}
.mini-sel{font:inherit;font-weight:800;font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;margin-left:auto}
.plan{position:relative}
.plan h3{margin:0;font-size:24px;color:var(--blue-2)}
.plan ul{list-style:none;padding:0;margin:14px 0 16px;display:grid;gap:8px}
.plan li{padding-left:26px;position:relative;font-weight:800}
.plan li::before{content:"✓";position:absolute;left:0;width:18px;height:18px;border-radius:50%;background:#EAF1FE;color:var(--blue);font-size:11px;display:grid;place-items:center;top:2px}
.plan-pro{box-shadow:0 0 0 2px var(--blue),0 16px 36px rgba(31,111,235,.16)}
.ribbon{position:absolute;top:16px;right:16px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px}
.poster{background:#fff;border:3px solid var(--red);border-radius:16px;padding:16px;text-align:center}
.poster h4{margin:0;font-family:"DM Sans",sans-serif;font-size:34px;color:var(--red);letter-spacing:.02em}
.poster img.ph{width:150px;height:150px;border-radius:50%;object-fit:cover;margin:8px auto;display:block;border:4px solid #FDECEC}
.poster b{font-family:"DM Sans",sans-serif;font-size:24px;color:var(--ink)}
.poster p{margin:4px 0;font-weight:700}
.poster .tel{font-family:"DM Sans",sans-serif;font-size:22px;color:var(--blue-2)}
.poster .qr{width:70px;height:70px;margin:6px auto 0;display:block}

.ml-box{position:absolute;inset:0}
.map.is-live{background:#E9EEF4}
.map.is-live > .pin,.map.is-live > .zone-ring,.map.is-live > .nearlayer{display:none}
.map .map-card,.map .map-ctrl{z-index:3}
.ml-pin{width:46px;height:46px;border-radius:50%;padding:3px;border:0;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);animation:pulse 2s infinite}
.ml-pin img{width:100%;height:100%;border-radius:50%;display:block}
.ml-pin.cat{animation-delay:-1s}
.ml-near{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.ml-near i{width:16px;height:16px;border-radius:50%;background:#7FA6E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(127,166,232,.25)}
.ml-near b{font-size:10.5px;background:rgba(255,255,255,.92);border-radius:99px;padding:1px 7px;white-space:nowrap}
.map .maplibregl-ctrl-bottom-right{bottom:84px}
.demo-tag{position:absolute;left:12px;top:12px;z-index:3;font-size:11px;font-weight:800;color:#7A5200;background:rgba(255,244,214,.95);border-radius:99px;padding:3px 10px}
@media (max-width:1100px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .g-dash,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr)} .auth-side{display:none}
  .app{grid-template-columns:minmax(0,1fr)}

.bill-list em{font-style:normal;font-weight:800;font-size:14px;white-space:nowrap}
.appframe{position:fixed;inset:0;background:#F7F9FD;z-index:5}
.np-lang{display:none!important} /* la langue se règle dans l'app (Compte) */
.appframe iframe{border:0;width:100%;height:100%;display:block}
.demo-acc{margin-top:18px;padding:14px 16px;border-radius:16px;background:#F7F5FE;border:1.5px solid #E2DBFB;display:flex;flex-direction:column;gap:6px}
.demo-acc b{font-size:14px}.demo-acc span{font-size:13.5px;color:var(--muted,#5E6B80);line-height:1.6}.demo-acc code{font:700 13.5px/1 "DM Sans",system-ui,sans-serif;color:var(--ink,#16181D)}
.demo-acc .btn{align-self:flex-start;margin-top:4px}
</style>
<script src="refs/noopie-i18n.js?v=7"></script>
</head>
<body>
<!-- « Mon compte » sur le site = l'application Noopie elle-même : même connexion, même compte,
     mêmes fonctions et mêmes données que sur téléphone (compte de présentation : marie@noopie.app). -->
<div class="appframe" id="app"><iframe id="appframe" title="Mon espace Noopie" allow="geolocation"></iframe></div>
<script>
(() => {
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  // La langue choisie sur le site est reprise par l'app
  ls.set('noopie.lang', ls.get('np-lang')||'fr');
  // ?v= : évite qu'un navigateur garde en mémoire une ancienne version de l'app
  document.getElementById('appframe').src='./app/?v='+Date.now();
  window.addEventListener('storage',e=>{if(e.key==='np-lang'&&e.newValue&&window.NoopieLang)try{NoopieLang.set(e.newValue)}catch(x){}});
})();
</script>
</body>
</html>
